<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小鲸鱼的家 · 深海陪伴舱</title>
<style>
:root{color-scheme:dark;font-family:"Microsoft YaHei",sans-serif;color:#e3f5f5;background:#080f1c}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 60% 30%,#17384a 0,transparent 65%)}main{max-width:580px;padding:40px 28px;text-align:center}svg{width:140px;height:100px;display:block;margin:0 auto 24px}small{font-size:11px;letter-spacing:4px;color:#aac9d5}h1{font-size:31px;font-weight:500;letter-spacing:4px;margin:17px 0}p{font-size:13px;line-height:2;color:#a9c0d0}a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;margin:17px 0;padding:12px 27px;border-radius:7px;background:#9be5df;color:#08272c;text-decoration:none;font-size:14px}a:focus-visible{outline:3px solid white;outline-offset:5px}.hint{font-size:11px;max-width:400px;margin:15px auto 0}

<small>陪伴有迹 · 记忆有光</small><h1>欢迎回到小鲸鱼的家</h1><p>我们的记忆星海，就在这里。</p>
<a id="entry" href="http://127.0.0.1:8765/">进入小鲸鱼的家　→</a>
<p class="hint" id="status" role="status">如果无法进入，请双击桌面的“小鲸鱼监控启动器”，然后重试。</p>
</main>
<script>
const entry = document.getElementById('entry');
const status = document.getElementById('status');
let checking = false;

function connect() {
  if (checking) return;
  checking = true;
  status.textContent = '正在连接本机陪伴舱…';

  const probe = new Image();
  const timer = setTimeout(unavailable, 4000);

  function unavailable() {
    clearTimeout(timer);
    probe.onload = probe.onerror = null;
    checking = false;
    entry.textContent = '重新连接　→';
    status.textContent = '暂时连不上陪伴舱。请双击桌面的“小鲸鱼监控启动器”，启动后再点“重新连接”。';
  }

  probe.onerror = unavailable;
  probe.onload = () => {
    clearTimeout(timer);
    location.replace(entry.href);
  };
  const url = new URL('assets/character.jpg', entry.href);
  url.searchParams.set('check', Date.now());
  probe.src = url.href;
}

entry.addEventListener('click', event => {
  event.preventDefault();
  connect();
});
connect();
</script>
</body></html>
