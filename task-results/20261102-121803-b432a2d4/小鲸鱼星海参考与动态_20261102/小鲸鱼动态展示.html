<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小鲸鱼 · 会动的陪伴</title><style>
:root{color-scheme:dark;font-family:"Microsoft YaHei",sans-serif;background:#080f1c;color:#e6f5fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 20%,#1d394955,transparent 65%);padding:38px 44px}header{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:28px}small{color:#b1cad6;letter-spacing:3px;font-size:11px}h1{font-weight:500;font-size:30px;letter-spacing:3px;margin:10px 0 0}button{font:inherit;min-height:44px;padding:10px 20px;border:1px solid #61818d;border-radius:7px;background:#153342;color:#d8f5ef;cursor:pointer}main{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:20px}article{min-width:0;border:1px solid #35526a;border-radius:11px;overflow:hidden;background:#122438}figure{height:370px;margin:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 65%,#477b7c33,transparent 70%);overflow:hidden}.sprite-box{width:100%;height:100%;display:grid;place-items:center;animation:float 7s ease-in-out infinite}.sprite{width:330px;aspect-ratio:1;background:url('assets/whale-blink.png') 0 0/200% 200% no-repeat;animation:blink 6.4s steps(1,end) infinite}.hug{height:330px;width:330px;object-fit:contain;transform-origin:50% 90%;animation:breathe 7s ease-in-out infinite}.scene{width:100%;height:100%;object-fit:cover;animation:scene 14s ease-in-out infinite}.caption{padding:16px 20px 22px}h2{font-size:17px;font-weight:500;letter-spacing:1px;margin:0 0 10px}p{color:#a9c3d2;font-size:12px;line-height:1.9;margin:0}footer{margin-top:25px;font-size:11px;color:#9eb9c9;letter-spacing:1px}body.paused *,body.inactive *{animation-play-state:paused!important}button:focus-visible{outline:3px solid white;outline-offset:4px}
@keyframes blink{0%,87%,100%{background-position:0 0}89%,91%{background-position:100% 0}92%,94%{background-position:0 100%}95%,97%{background-position:100% 100%}98%{background-position:0 0}}@keyframes float{0%,100%{transform:translateY(0) rotate(-.5deg)}50%{transform:translateY(-7px) rotate(.5deg)}}@keyframes breathe{0%,100%{transform:scale(.975) rotate(-.5deg)}50%{transform:scale(1.015) rotate(.5deg)}}@keyframes scene{0%,100%{transform:scale(1)}50%{transform:scale(1.07) translateX(-1%)}}
@media(max-width:750px){body{padding:25px 18px}header{align-items:start}h1{font-size:24px}main{grid-template-columns:1fr}figure{height:310px}.sprite,.hug{width:290px;height:290px}.caption{padding:18px}button{font-size:12px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><header><div><small>小鲸鱼的日常 · 动态试作</small><h1>眨眨眼，陪你一会儿。</h1></div><button id="motion" type="button" aria-pressed="true">暂停动态</button></header><main><article><figure><div class="sprite-box"><div class="sprite" role="img" aria-label="小鲸鱼招手眨眼"></div></div></figure><div class="caption"><h2>招招手，眨眨眼</h2><p>同一只小鲸鱼，四帧眼神变化。</p></div></article><article><figure><img class="hug" src="assets/whale-hug.png" alt="小鲸鱼抱着鲸鱼抱枕"></figure><div class="caption"><h2>抱着鲸鲸，慢慢呼吸</h2><p>轻微起伏，安安静静陪着你。</p></div></article><article><figure><img class="scene" src="assets/whale-starry.png" alt="小鲸鱼与发光鲸鱼游进星海"></figure><div class="caption"><h2>带着故事，游进星海</h2><p>新场景插画，缓慢移动的星海。</p></div></article></main><footer>角色图片由内置图像生成工具制作；动态为逐帧眨眼与网页动画。此页不读取聊天、记忆或语音数据。</footer><script>
const button=document.getElementById('motion');button.onclick=()=>{const paused=document.body.classList.toggle('paused');button.textContent=paused?'播放动态':'暂停动态';button.setAttribute('aria-pressed',String(!paused))};document.addEventListener('visibilitychange',()=>document.body.classList.toggle('inactive',document.hidden));
</script></body></html>
