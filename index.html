<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>欢迎来到我的海底世界 🐠</title>
		<link rel="stylesheet" href="css/ocean-theme.css" />
		<link rel="stylesheet" href="css/index.css" />
		<link rel="stylesheet" href="css/base.css" />
		<style>
			/* 页面加载动画 */
			.page-loader {
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background: linear-gradient(180deg, #0a2a43, #1a5276);
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				z-index: 9999;
				transition: opacity 0.5s ease;
			}

			.page-loader.hide {
				opacity: 0;
				pointer-events: none;
			}

			.loader-bubble {
				width: 60px;
				height: 60px;
				border: 4px solid rgba(133, 193, 233, 0.3);
				border-top-color: #85c1e9;
				border-radius: 50%;
				animation: spin 1s linear infinite;
				margin-bottom: 20px;
			}

			.loader-text {
				color: #85c1e9;
				font-size: 18px;
				font-family: "楷体", serif;
				animation: shimmer 2s ease-in-out infinite;
			}

			@keyframes spin {
				to { transform: rotate(360deg); }
			}

			/* 气泡装饰 */
			.bubble-deco {
				position: fixed;
				border-radius: 50%;
				background: rgba(255, 255, 255, 0.1);
				border: 1px solid rgba(255, 255, 255, 0.2);
				animation: bubble-rise linear infinite;
				pointer-events: none;
			}
		</style>
	</head>
	<body>
		<!-- 加载动画 -->
		<div class="page-loader" id="loader">
			<div class="loader-bubble"></div>
			<div class="loader-text">正在潜入深海...</div>
		</div>

		<!-- 装饰气泡 -->
		<div class="bubble-deco" style="width: 20px; height: 20px; left: 10%; animation-duration: 15s; animation-delay: 0s;"></div>
		<div class="bubble-deco" style="width: 15px; height: 15px; left: 30%; animation-duration: 20s; animation-delay: 2s;"></div>
		<div class="bubble-deco" style="width: 25px; height: 25px; left: 50%; animation-duration: 18s; animation-delay: 4s;"></div>
		<div class="bubble-deco" style="width: 12px; height: 12px; left: 70%; animation-duration: 22s; animation-delay: 1s;"></div>
		<div class="bubble-deco" style="width: 18px; height: 18px; left: 90%; animation-duration: 16s; animation-delay: 3s;"></div>

		<div id="bkground">
			<div class="my-information">
				<i></i>
				<h3>你的名字</h3>
				<h4>你的学校名称</h4>
				<h5>你的专业</h5>
				<p>欢迎来到我的海底世界！</p>
				<p>这里有珊瑚、鱼群和无尽的蔚蓝</p>
				<p>请轻轻潜入这片深海 🐚</p>
				<a href="./html/home.html">&nbsp;&nbsp;潜入深海&nbsp;&nbsp;</a>
			</div>
		</div>

		<script>
			// 页面加载完成后隐藏加载动画
			window.addEventListener('load', function() {
				setTimeout(function() {
					document.getElementById('loader').classList.add('hide');
				}, 800);
			});
		</script>
	</body>
</html>
