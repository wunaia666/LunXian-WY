<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>珊瑚留言区 🐚</title>
		<link rel="stylesheet" href="../css/ocean-theme.css" />
		<link rel="stylesheet" href="../css/message.css" />
		<link rel="stylesheet" href="../css/base.css" />
		<style>
			/* 表单进入动画 */
			.form-section {
				animation: fadeInUp 0.8s ease forwards;
				opacity: 0;
			}

			#board1 .form-section { animation-delay: 0.2s; }
			#board2 .form-section { animation-delay: 0.4s; }
			#date .calendar-section { animation-delay: 0.6s; }

			@keyframes fadeInUp {
				from {
					opacity: 0;
					transform: translateY(30px);
				}
				to {
					opacity: 1;
					transform: translateY(0);
				}
			}

			/* 输入框焦点效果 */
			input:focus, textarea:focus, select:focus {
				animation: input-glow 0.3s ease;
			}

			@keyframes input-glow {
				0% { box-shadow: 0 0 0 0 rgba(133, 193, 233, 0.4); }
				50% { box-shadow: 0 0 0 8px rgba(133, 193, 233, 0.2); }
				100% { box-shadow: 0 0 0 3px rgba(133, 193, 233, 0.2); }
			}

			/* 按钮点击效果 */
			button:active {
				transform: scale(0.95);
			}

			/* 海洋装饰 */
			.message-deco {
				position: fixed;
				font-size: 28px;
				opacity: 0.3;
				animation: float-gentle 8s ease-in-out infinite;
				pointer-events: none;
				z-index: 0;
			}

			.message-deco:nth-child(1) { top: 15%; right: 5%; animation-delay: 0s; }
			.message-deco:nth-child(2) { bottom: 20%; left: 3%; animation-delay: 3s; }
		</style>
	</head>
	<body>
		<!-- 海洋装饰 -->
		<div class="message-deco">🐚</div>
		<div class="message-deco">🐡</div>

		<!-- 顶部标题 -->
		<div id="header">
			<div class="message-header">
				<h1>🐚 欢迎来到珊瑚留言区</h1>
				<p>在这片蔚蓝深海里，你可以留言、登记、记录日程，也可以留下只属于你的海底日记</p>
			</div>
		</div>

		<!-- 留言板 -->
		<div id="board1">
			<div class="form-section">
				<h2>🐚 珊瑚留言板</h2>
				<form class="message-form">
					<div class="block1">
						<label for="user">昵称*</label>
						<input id="user" type="text" placeholder="你的海洋昵称" required="required"/>
					</div>
					<div class="block1">
						<label for="mail">邮箱*</label>
						<input id="mail" type="email" placeholder="你的邮箱" required="required"/>
					</div>
					<div class="block2">
						<label>留言内容</label>
						<textarea placeholder="想对深海说的话..." rows="6" required="required"></textarea>
					</div>
					<div class="submit">
						<button type="submit">🐚 投入海底</button>
					</div>
				</form>
			</div>
		</div>

		<!-- 登记表 -->
		<div id="board2">
			<div class="form-section">
				<h2>📋 海底居民登记表</h2>
				<form class="info-form">
					<div class="form1">
						<fieldset>
							<legend>🐚 个人信息</legend>
							<div class="block1">
								<label for="name">姓名*</label>
								<input id="name" type="text" placeholder="你的海洋姓名" required="required"/>
							</div>
							<div class="block1">
								<label for="address">地址*</label>
								<input id="address" type="text" placeholder="你的海底地址" required="required"/>
							</div>
							<div class="block1">
								<label for="date">生日*</label>
								<input id="date" type="date" required="required"/>
							</div>
							<div class="block1">
								<label>性别*</label>
								<select>
									<option>男</option>
									<option>女</option>
								</select>
							</div>
						</fieldset>
					</div>
					<div class="form2">
						<fieldset>
							<legend>🐬 喜好调查</legend>
							<p>你喜欢这个海底世界吗？
							<input type="radio" name="like"/> 喜欢
							<input type="radio" name="like"/> 不喜欢
							</p>
							<p>你喜欢的原因：
							<input type="checkbox"/> 海洋主题
							<input type="checkbox"/> 珊瑚装饰
							<input type="checkbox"/> 深海氛围
							<input type="checkbox"/> 鱼群动画
							<input type="checkbox"/> 海底光线
							<input type="checkbox"/> 贝壳元素
							</p>
						</fieldset>
					</div>
					<div class="form3">
						<fieldset>
							<legend>💌 你的海底建议</legend>
							<textarea placeholder="提供你的深海建议..." rows="6" required="required"></textarea>
						</fieldset>
					</div>
					<div class="submit">
						<button type="submit">🐚 投入深海</button>
					</div>
				</form>
			</div>
		</div>

		<!-- 日历 -->
		<div id="date">
			<div class="calendar-section">
				<h2>🗓️ 海底活动日历 · 2025年5月</h2>
				<table class="calendar-table">
					<thead>
						<tr><td>日</td><td>一</td><td>二</td><td>三</td><td>四</td><td>五</td><td>六</td></tr>
					</thead>
					<tbody>
						<tr><td></td><td></td><td></td><td></td><td class="day">1</td><td class="day">2</td><td class="day">3</td></tr>
						<tr><td class="day">4</td><td class="day">5</td><td>6</td><td>7</td><td>8</td><td>9</td><td>10</td></tr>
						<tr><td>11</td><td>12</td><td>13</td><td>14</td><td>15</td><td>16</td><td>17</td></tr>
						<tr><td>18</td><td>19</td><td>20</td><td>21</td><td>22</td><td>23</td><td>24</td></tr>
						<tr><td>25</td><td>26</td><td>27</td><td>28</td><td>29</td><td>30</td><td class="day">31</td></tr>
					</tbody>
				</table>
			</div>
		</div>

		<!-- 左侧导航 -->
		<div class="box">
			<a href="../index.html">海底入口</a>
			<a href="home.html">海洋主页</a>
			<a href="detail.html">深海探索</a>
			<a href="message.html" class="active">珊瑚留言</a>
		</div>
	</body>
</html>
